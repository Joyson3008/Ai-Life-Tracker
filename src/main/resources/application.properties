# =========================================================
# APPLICATION PROFILES & SERVER CONFIGURATION
# =========================================================
spring.application.name=ai-life-tracker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.address=0.0.0.0
server.port=${PORT:8080}

# =========================================================
# DATABASE (SUPABASE / POSTGRESQL)
# Supports both DB_* and SPRING_DATASOURCE_* environment variables
# =========================================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_life_tracker}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration (optimized for Supabase Transaction Pooler)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Crucial for Supabase PgBouncer pooler (port 6543)
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================================================
# AI CONFIGURATION (GROQ)
# Supports both AI_API_KEY and GROQ_API_KEY environment variables
# =========================================================
groq.api.key=${AI_API_KEY:${GROQ_API_KEY:}}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.ai.model=${AI_MODEL:${GROQ_MODEL:llama-3.3-70b-versatile}}

# =========================================================
# CORS CONFIGURATION
# Allowed origins for local dev and Vercel production/preview deployments
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://*.vercel.app}